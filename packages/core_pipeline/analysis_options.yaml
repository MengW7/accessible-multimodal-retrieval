# Pipeline static analysis. Same boundary rules as core_storage.
include: package:lints/recommended.yaml

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
  errors:
    todo: ignore

linter:
  rules:
    - avoid_print
    - directives_ordering
    - prefer_final_locals
    - prefer_single_quotes
    - unnecessary_parenthesis
