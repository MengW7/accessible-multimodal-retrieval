# 文件摄取/解析层的静态分析策略
#
# 强行约束层级边界的严密性
include: package:lints/recommended.yaml

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
  errors:
    todo: ignore

linter:
  rules:
    - avoid_print
    - directives_ordering
    - prefer_final_locals
    - prefer_single_quotes
    - unnecessary_parenthesis
