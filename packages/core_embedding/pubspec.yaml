name: core_embedding
description: >-
  Offline text and image embedding engine for the accessible multimodal
  local content retrieval system. Document text is tokenized and embedded
  behind EmbeddingRuntime. Image inference is a later phase.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.0

dependencies:
  characters: ^1.4.0
  core_parsing:
    path: ../core_parsing
  meta: ^1.18.0
  path: ^1.9.1

dev_dependencies:
  coverage: ^1.15.1
  lints: ^6.1.0
  test: ^1.31.1
