name: core_retrieval
description: >-
  Offline three-channel retrieval for the accessible multimodal local
  content retrieval system. Fusion uses rank, not raw cosine.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.0

dependencies:
  core_embedding:
    path: ../core_embedding
  core_parsing:
    path: ../core_parsing
  core_storage:
    path: ../core_storage
  meta: ^1.18.0

dev_dependencies:
  coverage: ^1.15.1
  lints: ^6.1.0
  test: ^1.31.1
