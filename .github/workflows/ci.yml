name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop - ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
          - os: macos-latest
            target: macos
          - os: ubuntu-22.04
            target: linux
    defaults:
      run:
        shell: bash
        working-directory: apps/desktop
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: true

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev libstdc++-12-dev libsqlite3-dev

      - name: Record environment
        run: |
          mkdir -p "$GITHUB_WORKSPACE/ci-evidence"
          {
            git rev-parse HEAD
            echo "Runner: $RUNNER_OS / $RUNNER_ARCH"
            flutter --version
          } 2>&1 | tee "$GITHUB_WORKSPACE/ci-evidence/environment.txt"

      - name: Install project dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze --no-pub 2>&1 | tee "$GITHUB_WORKSPACE/ci-evidence/analyze.txt"

      # Models, Python/ONNX and Tika are not provisioned here. The opt-in
      # AMR_E_REAL_RUNTIME integration test remains skipped in this workflow.
      - name: Widget and unit tests
        run: flutter test --no-pub --reporter expanded 2>&1 | tee "$GITHUB_WORKSPACE/ci-evidence/tests.txt"

      - name: Build desktop application
        run: flutter build ${{ matrix.target }} --release --no-pub 2>&1 | tee "$GITHUB_WORKSPACE/ci-evidence/build.txt"

      - name: Upload verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}-logs
          path: ci-evidence/
          if-no-files-found: warn
          retention-days: 14
